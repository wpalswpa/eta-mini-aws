# 서버의 바라는 상태는 .env : IMAGE, TAG, MODEL_VERSION, MODEL_DIR
services:
  api:
    image: ${IMAGE}/eta-go:${TAG}
    restart: unless-stopped
    ports:
      - "80:8080" # 서버의 80(HTTP) → 컨테이너의 8080
    environment:
      MODEL_IMPL: onnx
      # 모델 판이 없으면(baked) 이미지에 구운 모델을 쓴다
      MODEL_DIR: ${MODEL_DIR:-artifacts}
    volumes:
      - /srv/eta/models:/models:ro
